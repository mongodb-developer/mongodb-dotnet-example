name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '15 6 * * 1'

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        dotnet-version: ["10.0.x"]

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GamesDatabaseSettings__ConnectionString: mongodb://localhost:27017
      GamesDatabaseSettings__DatabaseName: GamesDB
      GamesDatabaseSettings__GamesCollectionName: Games
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5050

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/MongodbDotnetExample.Tests/MongodbDotnetExample.Tests.csproj --configuration Release --no-restore

      - name: Start API
        run: dotnet run --configuration Release --no-build --no-launch-profile > /tmp/server.log 2>&1 &

      - name: Wait for health
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:5050/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/server.log
          exit 1

      - name: Verify seeded data endpoint
        run: |
          body=$(curl -fsS http://localhost:5050/api/games)
          echo "$body"
          echo "$body" | grep -q "Celeste"

  notify-on-failure:
    needs: build-and-smoke
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or update CI failure issue for @mongodb-developer/learning-fuel
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI failure on ${context.ref}`;
            const body = [
              '@mongodb-developer/learning-fuel the CI workflow failed.',
              '',
              `Workflow: ${context.workflow}`,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            }
